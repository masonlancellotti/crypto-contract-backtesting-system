[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-microstructure-lab"
version = "0.1.0"
description = "Leakage-safe ML research lab for short-horizon Kalshi crypto binary markets: purged CV, isotonic calibration, fee-aware executable backtests, and a false-discovery-controlled alpha-discovery engine. Research-only; live execution intentionally disabled."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mason Lancellotti", email = "lancellottimason@gmail.com" }]

# Core scaffolds import using only the standard library. These dependencies are
# needed once real feeds / models are wired up; adapters import them lazily.
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
data = [
    "websockets>=12.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "pyarrow>=15.0",
    "duckdb>=0.10",
]
# Serious ML/data stack for real training/calibration/backtesting. Missing any of
# these degrades to the stdlib (pure_ml) DIAGNOSTIC-ONLY path — never silently used
# for tradable results. lightgbm is an OPTIONAL challenger (may lack a 3.13 wheel);
# its absence is non-fatal and only disables the LightGBM model.
models = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "duckdb>=0.10",
    "lightgbm>=4.1",
]
# Auth / live transport (RSA request signing + websocket streaming). Live trading
# stays DISABLED regardless of these being installed.
live = [
    "cryptography>=42.0",
    "websockets>=12.0",
    "requests>=2.31",
]
# Keyless research dashboard (btc5m dashboard, port 8791). Serves committed
# sample_data + report JSONs only; no network, no keys.
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Pushover notifications use only the standard library (urllib) — no extra deps.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
btc5m = "btc5m.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforce the correctness-critical rules (pyflakes + syntax): dead imports,
# undefined/redefined names, f-string and string-format bugs. The E7xx style rules
# (deliberate compact `a; b` one-liners in this codebase) and F841 (unused locals in
# a few research paths) are intentionally not enforced.
select = ["E9", "F"]
ignore = ["F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
