# Default configuration — SAFE. Values may be overridden by environment
# variables (see .env.example) and by mode-specific configs (paper.yaml, etc.).
# Environment variables ALWAYS win over YAML.

trading:
  mode: paper                 # offline | record-only | backtest | paper | live
  live_trading_enabled: false
  require_manual_confirmation: true
  kill_switch_enabled: true

localization:
  timezone: Europe/Dublin
  eod_summary_time: "00:00"

# Contract universe / target definition
contract:
  asset: BTC
  duration_seconds: 300       # 5-minute binaries
  target: "P(YES=1) = P(BTC finishes above contract line at expiry)"

risk:
  max_order_size: null
  max_position_per_contract: null
  max_daily_loss: null
  max_open_risk: null
  max_trades_per_hour: null
  # Feed/quality gates
  max_quote_age_ms: 1500      # reject quotes staler than this
  max_clock_skew_ms: 2000     # reject if local clock skew exceeds this
  max_feed_gap_ms: 5000       # reject after a feed gap longer than this
  reject_crossed_book: true   # reject crossed/invalid Polymarket books
  require_settlement_metadata: true
  max_calibration_age_hours: 24  # reject if model calibration is older

execution:
  # Execution is NEVER assumed at midpoint. Costs are charged explicitly.
  assume_midpoint_fills: false
  taker_fee_bps: 0.0          # set to real Polymarket fee schedule when known
  min_net_edge_cents: 2.0     # minimum post-cost edge to consider a candidate
  slippage_model: depth_walk  # walk the book; never midpoint

paper:
  starting_bankroll: 1000.0

data:
  data_dir: ./data
  reports_dir: ./reports
  record_raw: true
  record_normalized: true

sources:
  polymarket:
    enabled: true
    gamma_url: "https://gamma-api.polymarket.com"      # market discovery (public)
    rest_base_url: "https://clob.polymarket.com"        # CLOB order books (public)
    ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  coinbase:
    enabled: true
    rest_url: "https://api.exchange.coinbase.com"        # spot ticker/trades/candles (public)
    ws_url: "wss://ws-feed.exchange.coinbase.com"
    product_ids: ["BTC-USD"]
  binance_futures:
    enabled: true
    rest_url: "https://fapi.binance.com"                  # USDT-M bookTicker/trades (public)
    ws_url: "wss://fstream.binance.com/ws"
    symbols: ["btcusdt"]
  deribit:
    enabled: false                                       # OPTIONAL aux vol/options source (not a venue)
    base_url: "https://www.deribit.com"
    poll_interval_seconds: 30                            # slow-moving context; poll infrequently
    stale_threshold_seconds: 180                         # snapshot older than this => flagged stale on rows

notifications:
  provider: auto              # auto -> pushover if enabled+creds present, else noop
  event_prefix: btc5m
  pushover_api_url: "https://api.pushover.net/1/messages.json"

model:
  baseline: neutral           # baseline returns an uncertain/neutral prob
  uncertain_band: [0.45, 0.55]  # within band => WATCH / MANUAL_REVIEW

logging:
  level: INFO
