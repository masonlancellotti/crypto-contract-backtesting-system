name: Nightly (full suite)

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  full-suite:
    name: full offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install numpy pandas scikit-learn scipy pyarrow
          pip install lightgbm || echo "lightgbm wheel unavailable; optional challenger skipped"

      - name: Lint (ruff)
        run: ruff check .

      # The complete offline suite (677 tests, no keys, no network). Runs here rather
      # than on every push to keep PR feedback fast; the push CI runs a representative
      # subset. Locally this suite completes in ~1-2 minutes.
      - name: Full test suite
        run: python -m pytest -q -p no:cacheprovider
